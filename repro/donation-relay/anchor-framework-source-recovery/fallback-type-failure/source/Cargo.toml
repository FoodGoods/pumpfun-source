[package]
name = "relay-anchor-idl-reconstruction-probe"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib", "lib"]
[dependencies]
anchor-lang = { version = "=0.31.1", features = ["event-cpi"] }
indexmap = "=2.11.4"
legacy = { package = "donation-relay-source-proposal", path = "legacy" }
[workspace]
resolver = "2"
[profile.release]
panic = "abort"
overflow-checks = true
lto = false
codegen-units = 1
[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
anchor-debug = []
